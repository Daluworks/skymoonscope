name: Large PR warning

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  warn:
    name: Warn on large diff
    runs-on: ubuntu-latest
    steps:
      - name: Check changed lines and update warning
        uses: actions/github-script@v7
        env:
          DIFF_THRESHOLD: ${{ vars.PR_DIFF_WARNING_THRESHOLD || '800' }}
        with:
          script: |
            const thresholdText = process.env.DIFF_THRESHOLD;
            if (!/^\d+$/.test(thresholdText)) {
              throw new Error(
                `PR_DIFF_WARNING_THRESHOLD must be a non-negative integer; received "${thresholdText}".`
              );
            }

            const threshold = Number(thresholdText);
            if (!Number.isSafeInteger(threshold)) {
              throw new Error(
                `PR_DIFF_WARNING_THRESHOLD must be a safe integer; received "${thresholdText}".`
              );
            }

            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const changedLines = files.reduce(
              (total, file) => total + file.additions + file.deletions,
              0
            );
            const marker = '<!-- large-pr-diff-warning -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (changedLines > threshold) {
              const body = [
                marker,
                `⚠️ This pull request changes **${changedLines.toLocaleString()} lines**, exceeding the configured limit of **${threshold.toLocaleString()}** changed lines (additions + deletions).`,
                '',
                'Consider splitting the changes into smaller pull requests to make review easier.',
              ].join('\n');

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
              }
            } else if (existingComment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id,
              });
            }
